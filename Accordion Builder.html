<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accordion Builder · Dynamic Admin</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Marked.js for markdown preview -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f2f5fa;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 1.5rem;
      color: #0b1a33;
    }

    .admin-wrapper {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ----- header ----- */
    .admin-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.8rem;
      gap: 1rem;
    }
    .admin-header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .admin-header h1 i {
      color: #2563eb;
    }
    .admin-header .badge {
      background: #eef4ff;
      padding: 0.3rem 1.2rem;
      border-radius: 30px;
      font-size: 0.85rem;
      color: #1a3c7a;
      font-weight: 500;
      border: 1px solid #d6e0f0;
    }

    /* ----- main layout: sidebar + editor + preview ----- */
    .admin-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.8rem;
      align-items: start;
    }

    /* --- sidebar (section list) --- */
    .sidebar {
      background: #ffffff;
      border-radius: 24px;
      padding: 1.5rem 1rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      border: 1px solid #e9edf4;
    }
    .sidebar h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #1f3450;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar h2 span {
      background: #eef4ff;
      padding: 0.1rem 0.6rem;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #2563eb;
    }
    .section-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: 500px;
      overflow-y: auto;
      padding-right: 0.2rem;
    }
    .section-list .list-item {
      display: flex;
      align-items: center;
      padding: 0.5rem 0.6rem;
      border-radius: 12px;
      background: #fafcff;
      border: 1px solid transparent;
      transition: background 0.15s, border 0.15s;
      cursor: pointer;
      gap: 0.4rem;
    }
    .section-list .list-item:hover {
      background: #f2f7ff;
      border-color: #d6e0f0;
    }
    .section-list .list-item.active {
      background: #eef4ff;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px #2563eb30;
    }
    .section-list .list-item .drag-handle {
      color: #b0c2da;
      cursor: grab;
      font-size: 0.9rem;
      margin-right: 0.2rem;
    }
    .section-list .list-item .info {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }
    .section-list .list-item .info i {
      color: #2563eb;
      width: 1.2rem;
      text-align: center;
      font-size: 0.9rem;
    }
    .section-list .list-item .info .title {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .section-list .list-item .actions {
      display: flex;
      gap: 0.15rem;
      flex-shrink: 0;
    }
    .section-list .list-item .actions button {
      background: transparent;
      border: none;
      padding: 0.2rem 0.3rem;
      border-radius: 6px;
      color: #6b7f9e;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      font-size: 0.8rem;
    }
    .section-list .list-item .actions button:hover {
      background: #eef4ff;
      color: #2563eb;
    }
    .section-list .list-item .actions button.danger:hover {
      background: #fee9e9;
      color: #dc2626;
    }

    .sidebar .add-btn {
      margin-top: 1.2rem;
      width: 100%;
      padding: 0.6rem;
      border: 1.5px dashed #d6e0f0;
      background: #fafcff;
      border-radius: 40px;
      font-weight: 500;
      color: #2563eb;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .sidebar .add-btn:hover {
      background: #eef4ff;
      border-color: #2563eb;
    }

    /* --- editor panel --- */
    .editor-panel {
      background: #ffffff;
      border-radius: 24px;
      padding: 1.8rem 2rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      border: 1px solid #e9edf4;
    }
    .editor-panel .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .editor-panel .panel-header h2 {
      font-size: 1.2rem;
      font-weight: 600;
    }
    .editor-panel .panel-header .status {
      font-size: 0.85rem;
      color: #4f6582;
      background: #f2f6fe;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
    }

    .editor-form .form-group {
      margin-bottom: 1.2rem;
    }
    .editor-form label {
      display: block;
      font-weight: 500;
      font-size: 0.9rem;
      color: #1f3450;
      margin-bottom: 0.25rem;
    }
    .editor-form input[type="text"],
    .editor-form select {
      width: 100%;
      padding: 0.6rem 1rem;
      border: 1.5px solid #dce3ed;
      border-radius: 14px;
      font-size: 0.95rem;
      background: #fafcff;
      transition: border 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    .editor-form input:focus,
    .editor-form select:focus {
      border-color: #2563eb;
      outline: none;
      box-shadow: 0 0 0 4px #2563eb20;
      background: #ffffff;
    }
    .editor-form .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    /* markdown editor with tabs */
    .markdown-editor {
      border: 1.5px solid #dce3ed;
      border-radius: 16px;
      overflow: hidden;
      background: #fafcff;
    }
    .markdown-editor .tabs {
      display: flex;
      background: #f2f6fe;
      border-bottom: 1px solid #dce3ed;
    }
    .markdown-editor .tabs button {
      flex: 1;
      padding: 0.5rem 0;
      background: transparent;
      border: none;
      font-weight: 500;
      color: #4f6582;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      border-bottom: 2px solid transparent;
    }
    .markdown-editor .tabs button.active {
      color: #2563eb;
      border-bottom-color: #2563eb;
      background: #ffffff;
    }
    .markdown-editor .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.2rem;
      padding: 0.4rem 0.6rem;
      background: #ffffff;
      border-bottom: 1px solid #eef2f8;
    }
    .markdown-editor .toolbar button {
      background: transparent;
      border: none;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      color: #2b3e5c;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.1s;
    }
    .markdown-editor .toolbar button:hover {
      background: #eef4ff;
      color: #2563eb;
    }
    .markdown-editor .toolbar .separator {
      width: 1px;
      background: #dce3ed;
      margin: 0 0.2rem;
    }
    .markdown-editor .editor-body {
      padding: 0.6rem 1rem;
    }
    .markdown-editor .editor-body textarea {
      width: 100%;
      min-height: 180px;
      border: none;
      resize: vertical;
      font-family: 'Inter', monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      background: transparent;
      outline: none;
      padding: 0;
      color: #0b1a33;
    }
    .markdown-editor .editor-body .preview-area {
      min-height: 180px;
      padding: 0.2rem 0;
      line-height: 1.6;
      font-size: 0.95rem;
      color: #1e2b41;
    }
    .markdown-editor .editor-body .preview-area table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.5rem 0;
    }
    .markdown-editor .editor-body .preview-area table th,
    .markdown-editor .editor-body .preview-area table td {
      border: 1px solid #dce3ed;
      padding: 0.4rem 0.6rem;
    }
    .markdown-editor .editor-body .preview-area ul,
    .markdown-editor .editor-body .preview-area ol {
      padding-left: 1.5rem;
    }

    .editor-actions {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.5rem;
      padding-top: 1.2rem;
      border-top: 1px solid #eef2f8;
    }
    .editor-actions .btn {
      padding: 0.6rem 1.8rem;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-success {
      background: #0b7e3d;
      color: white;
    }
    .btn-success:hover {
      background: #0a6b33;
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid #dce3ed;
      color: #1f3450;
    }
    .btn-outline:hover {
      background: #f2f6fe;
      border-color: #2563eb;
    }
    .btn-danger {
      background: #dc2626;
      color: white;
    }
    .btn-danger:hover {
      background: #b91c1c;
    }

    /* --- full accordion preview --- */
    .preview-panel {
      margin-top: 2rem;
      background: #ffffff;
      border-radius: 24px;
      padding: 1.8rem 2rem;
      border: 1px solid #e9edf4;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    .preview-panel h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .preview-panel h3 i {
      color: #2563eb;
    }
    .preview-panel .sub {
      color: #4f6582;
      font-size: 0.9rem;
      margin-bottom: 1.2rem;
    }

    .accordion-preview {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .accordion-item-preview {
      border: 1px solid #e9edf4;
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      transition: border 0.2s;
    }
    .accordion-item-preview:hover {
      border-color: #cdd6e6;
    }
    .accordion-item-preview .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.7rem 1.2rem;
      cursor: pointer;
      background: #fafcff;
      transition: background 0.15s;
      user-select: none;
    }
    .accordion-item-preview .header:hover {
      background: #f2f7ff;
    }
    .accordion-item-preview .header .label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
      font-size: 0.98rem;
    }
    .accordion-item-preview .header .label i {
      color: #2563eb;
      width: 1.3rem;
      text-align: center;
    }
    .accordion-item-preview .header .icon-toggle {
      color: #6b7b94;
      transition: transform 0.3s;
    }
    .accordion-item-preview.active .header .icon-toggle {
      transform: rotate(180deg);
    }
    .accordion-item-preview .body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.3s ease;
      padding: 0 1.2rem;
      background: #fbfdff;
      border-top: 0px solid transparent;
    }
    .accordion-item-preview.active .body {
      max-height: 800px;
      padding: 1.2rem 1.2rem 1.5rem;
      border-top: 1px solid #eef2f8;
    }
    .accordion-item-preview .body p {
      margin-bottom: 0.6rem;
    }
    .accordion-item-preview .body ul,
    .accordion-item-preview .body ol {
      padding-left: 1.5rem;
    }
    .accordion-item-preview .body table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.5rem 0;
    }
    .accordion-item-preview .body table th,
    .accordion-item-preview .body table td {
      border: 1px solid #dce3ed;
      padding: 0.3rem 0.6rem;
    }

    .empty-state {
      text-align: center;
      padding: 2rem 0;
      color: #6b7f9e;
    }
    .empty-state i {
      font-size: 2rem;
      color: #cdd6e6;
      margin-bottom: 0.5rem;
    }

    /* responsive */
    @media (max-width: 900px) {
      .admin-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .sidebar {
        order: 2;
      }
      .editor-panel {
        order: 1;
      }
      .preview-panel {
        order: 3;
      }
      .editor-form .form-row {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 480px) {
      body { padding: 0.8rem; }
      .admin-header h1 { font-size: 1.3rem; }
      .editor-panel { padding: 1.2rem; }
      .preview-panel { padding: 1.2rem; }
    }
  </style>
</head>
<body>

<div class="admin-wrapper">

  <!-- Header -->
  <header class="admin-header">
    <h1><i class="fas fa-layer-group"></i> Accordion Builder</h1>
    <span class="badge"><i class="fas fa-pencil-alt"></i> Dynamic · drag &amp; edit</span>
  </header>

  <!-- Main grid -->
  <div class="admin-grid">

    <!-- Sidebar: section list -->
    <aside class="sidebar">
      <h2>
        <span><i class="fas fa-list-ul"></i> Sections</span>
        <span id="sectionCount">0</span>
      </h2>
      <div class="section-list" id="sectionList">
        <!-- rendered by JS -->
      </div>
      <button class="add-btn" id="addSectionBtn"><i class="fas fa-plus"></i> Add section</button>
    </aside>

    <!-- Editor panel -->
    <section class="editor-panel" id="editorPanel">
      <div class="panel-header">
        <h2 id="editorTitle">Select a section to edit</h2>
        <span class="status" id="editorStatus">✏️ draft</span>
      </div>

      <form id="sectionForm" class="editor-form">
        <div class="form-row">
          <div class="form-group">
            <label for="sectionTitle"><i class="fas fa-tag"></i> Section title *</label>
            <input type="text" id="sectionTitle" placeholder="e.g. Technical Specifications" required />
          </div>
          <div class="form-group">
            <label for="sectionIcon"><i class="fas fa-icons"></i> Icon (FontAwesome class)</label>
            <input type="text" id="sectionIcon" placeholder="fa-microchip" value="fa-cube" />
          </div>
        </div>

        <div class="form-group">
          <label for="sectionStatus"><i class="fas fa-toggle-on"></i> Default state</label>
          <select id="sectionStatus">
            <option value="closed">Closed</option>
            <option value="open">Open (expanded)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Content (Markdown supported)</label>
          <div class="markdown-editor">
            <div class="tabs">
              <button type="button" class="active" data-tab="write">✏️ Write</button>
              <button type="button" data-tab="preview">👁️ Preview</button>
            </div>
            <div class="toolbar">
              <button type="button" data-cmd="h2"><strong>H2</strong></button>
              <button type="button" data-cmd="h3"><strong>H3</strong></button>
              <span class="separator"></span>
              <button type="button" data-cmd="bold"><strong>B</strong></button>
              <button type="button" data-cmd="italic"><em>I</em></button>
              <span class="separator"></span>
              <button type="button" data-cmd="ul">• list</button>
              <button type="button" data-cmd="ol">1. list</button>
              <button type="button" data-cmd="table">⎔ table</button>
              <span class="separator"></span>
              <button type="button" data-cmd="emoji"><i class="far fa-smile"></i> Emoji</button>
            </div>
            <div class="editor-body">
              <div id="writePanel" style="display:block;">
                <textarea id="sectionContent" placeholder="Write markdown here..." style="min-height:180px;"></textarea>
              </div>
              <div id="previewPanel" style="display:none;" class="preview-area"></div>
            </div>
          </div>
        </div>

        <div class="editor-actions">
          <button type="submit" class="btn btn-primary" id="saveBtn"><i class="fas fa-save"></i> Save</button>
          <button type="button" class="btn btn-outline" id="cancelBtn"><i class="fas fa-times"></i> Cancel</button>
          <button type="button" class="btn btn-danger" id="deleteBtn" style="margin-left:auto;"><i class="fas fa-trash-alt"></i> Delete</button>
        </div>
        <input type="hidden" id="editId" value="" />
      </form>
    </section>
  </div>

  <!-- Full accordion preview -->
  <section class="preview-panel">
    <h3><i class="fas fa-eye"></i> Live accordion preview</h3>
    <div class="sub">As seen on product page — click headers to expand/collapse</div>
    <div id="accordionPreview" class="accordion-preview">
      <!-- rendered by JS -->
    </div>
  </section>

</div>

<script>
  (function() {
    "use strict";

    // ----- default data (4 sections, no styling suggestion) -----
    const DEFAULT_SECTIONS = [
      {
        id: 's1',
        title: 'Know Your Gear',
        icon: 'fa-microchip',
        content: `**Samsung 25W USB-C Super Fast Charging Adapter** — compact, travel‑friendly, and powerful. Powers a Galaxy phone from 0 to ~50% in about 30 minutes. Built with PD 3.0 & PPS, it’s compatible with Samsung, iPhone 15+, tablets, earbuds, and most USB‑C devices. The intelligent chipset protects against overcurrent, overheating, and short circuits.\n\n- 25W Super Fast Charging (PD 3.0 + PPS)\n- Galaxy, iPhone 15+, tablets, earbuds\n- Overcurrent · overheat · short‑circuit protection\n- Compact single‑port · travel ready`,
        open: true
      },
      {
        id: 's2',
        title: 'Key Highlights',
        icon: 'fa-star',
        content: `- **25W Super Fast Charging** — PD 3.0 with PPS, up to 3A output\n- **Universal USB‑C** — charges Galaxy, iPhone 15+, tablets, earbuds, and most USB‑C devices (non‑Samsung at supported rate)\n- **Smart & safe** — built‑in protection against overcurrent, overheating, short‑circuit\n- **Compact single‑port design** — light enough for daily carry and travel`,
        open: false
      },
      {
        id: 's3',
        title: 'Technical Specifications',
        icon: 'fa-sliders-h',
        content: `| Attribute | Detail |\n| --- | --- |\n| Max Output | 25W (PD 3.0 with PPS) |\n| Output Rates | 9V / 2.77A · 5V / 3A |\n| Input | 100–240V, 50/60Hz (worldwide) |\n| Port | 1 × USB‑C |\n| Colour | Black / White |`,
        open: false
      },
      {
        id: 's4',
        title: 'Manufacturing Details',
        icon: 'fa-industry',
        content: `**SKU**: EP-TA800NBEGIN  \n**Marketed By**: Samsung India Electronics Pvt. Ltd.  \n**Country Of Origin**: Vietnam / India  \n**For Complaints**: 1800-40-7267864 · support@samsung.com`,
        open: false
      }
    ];

    // ----- state -----
    let sections = [];
    let selectedId = null;      // currently editing section id
    let nextId = 1;

    // DOM refs
    const listEl = document.getElementById('sectionList');
    const previewEl = document.getElementById('accordionPreview');
    const countEl = document.getElementById('sectionCount');

    const form = document.getElementById('sectionForm');
    const titleInput = document.getElementById('sectionTitle');
    const iconInput = document.getElementById('sectionIcon');
    const contentTextarea = document.getElementById('sectionContent');
    const statusSelect = document.getElementById('sectionStatus');
    const editIdHidden = document.getElementById('editId');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    const addBtn = document.getElementById('addSectionBtn');
    const editorTitle = document.getElementById('editorTitle');
    const editorStatus = document.getElementById('editorStatus');

    // markdown preview tabs
    const writePanel = document.getElementById('writePanel');
    const previewPanel = document.getElementById('previewPanel');
    const tabButtons = document.querySelectorAll('.tabs button');

    // helpers
    function generateId() { return 's' + (nextId++); }

    // render markdown preview
    function renderMarkdown(text) {
      if (!text) return '';
      return marked.parse(text);
    }

    // update preview panel content
    function updatePreviewContent() {
      const raw = contentTextarea.value;
      previewPanel.innerHTML = renderMarkdown(raw);
    }

    // toggle write/preview tabs
    tabButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        const tab = this.dataset.tab;
        tabButtons.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        if (tab === 'write') {
          writePanel.style.display = 'block';
          previewPanel.style.display = 'none';
        } else {
          writePanel.style.display = 'none';
          previewPanel.style.display = 'block';
          updatePreviewContent();
        }
      });
    });

    // toolbar commands: insert markdown snippets
    document.querySelectorAll('.toolbar [data-cmd]').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const cmd = this.dataset.cmd;
        const textarea = contentTextarea;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const selected = textarea.value.substring(start, end);
        let replacement = '';
        let cursorOffset = 0;
        switch (cmd) {
          case 'h2': replacement = `## ${selected || 'Heading 2'}`; cursorOffset = 3; break;
          case 'h3': replacement = `### ${selected || 'Heading 3'}`; cursorOffset = 4; break;
          case 'bold': replacement = `**${selected || 'bold text'}**`; cursorOffset = 2; break;
          case 'italic': replacement = `*${selected || 'italic text'}*`; cursorOffset = 1; break;
          case 'ul': replacement = `- ${selected || 'list item'}`; cursorOffset = 2; break;
          case 'ol': replacement = `1. ${selected || 'list item'}`; cursorOffset = 3; break;
          case 'table': replacement = `| Header 1 | Header 2 |\n| --- | --- |\n| Cell 1 | Cell 2 |`; cursorOffset = 0; break;
          case 'emoji': replacement = `:${selected || 'smile'}:`; cursorOffset = 1; break;
          default: return;
        }
        textarea.setRangeText(replacement, start, end, 'end');
        // set cursor
        const newCursor = start + replacement.length;
        textarea.selectionStart = textarea.selectionEnd = newCursor;
        textarea.focus();
        // if preview tab is active, update preview
        if (previewPanel.style.display !== 'none') {
          updatePreviewContent();
        }
      });
    });

    // ----- render functions -----
    function renderAll() {
      renderList();
      renderPreview();
      updateCount();
      // update editor if selected
      if (selectedId) {
        const sec = sections.find(s => s.id === selectedId);
        if (sec) {
          loadSectionToForm(sec);
        } else {
          // if section deleted while selected
          clearEditor();
        }
      } else {
        clearEditor();
      }
    }

    function renderList() {
      if (sections.length === 0) {
        listEl.innerHTML = `<div class="empty-state" style="padding:0.8rem 0;"><i class="fas fa-box-open"></i><p style="font-size:0.9rem;">No sections yet</p></div>`;
        return;
      }
      let html = '';
      sections.forEach((sec, idx) => {
        const active = (sec.id === selectedId) ? 'active' : '';
        const icon = sec.icon || 'fa-cube';
        html += `
          <div class="list-item ${active}" data-id="${sec.id}" onclick="window.selectSection('${sec.id}')">
            <span class="drag-handle" title="Drag to reorder (use arrows)"><i class="fas fa-grip-vertical"></i></span>
            <div class="info">
              <i class="fas ${icon}"></i>
              <span class="title">${sec.title}</span>
            </div>
            <div class="actions">
              <button onclick="event.stopPropagation(); window.moveSection('${sec.id}', -1)" title="Move up"><i class="fas fa-chevron-up"></i></button>
              <button onclick="event.stopPropagation(); window.moveSection('${sec.id}', 1)" title="Move down"><i class="fas fa-chevron-down"></i></button>
              <button class="danger" onclick="event.stopPropagation(); window.deleteSection('${sec.id}')" title="Delete"><i class="fas fa-trash-alt"></i></button>
            </div>
          </div>
        `;
      });
      listEl.innerHTML = html;
    }

    function renderPreview() {
      if (sections.length === 0) {
        previewEl.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><p>No sections to preview</p></div>`;
        return;
      }
      let html = '';
      sections.forEach((sec) => {
        const activeClass = sec.open ? 'active' : '';
        const icon = sec.icon || 'fa-cube';
        const contentHtml = renderMarkdown(sec.content || '');
        html += `
          <div class="accordion-item-preview ${activeClass}" data-id="${sec.id}">
            <div class="header" onclick="window.togglePreviewItem(this)">
              <span class="label"><i class="fas ${icon}"></i> ${sec.title}</span>
              <span class="icon-toggle"><i class="fas fa-chevron-down"></i></span>
            </div>
            <div class="body">${contentHtml}</div>
          </div>
        `;
      });
      previewEl.innerHTML = html;
    }

    function updateCount() {
      countEl.textContent = sections.length;
    }

    // ----- editor form -----
    function loadSectionToForm(sec) {
      titleInput.value = sec.title || '';
      iconInput.value = sec.icon || 'fa-cube';
      contentTextarea.value = sec.content || '';
      statusSelect.value = sec.open ? 'open' : 'closed';
      editIdHidden.value = sec.id;
      selectedId = sec.id;
      editorTitle.textContent = `✏️ Editing: ${sec.title}`;
      editorStatus.textContent = '🟢 editing';
      saveBtn.innerHTML = `<i class="fas fa-save"></i> Update`;
      deleteBtn.style.display = 'inline-flex';
      // if preview tab active, update preview
      if (previewPanel.style.display !== 'none') {
        updatePreviewContent();
      }
      // highlight list
      renderList();
    }

    function clearEditor() {
      titleInput.value = '';
      iconInput.value = 'fa-cube';
      contentTextarea.value = '';
      statusSelect.value = 'closed';
      editIdHidden.value = '';
      selectedId = null;
      editorTitle.textContent = 'Select a section to edit';
      editorStatus.textContent = '✏️ draft';
      saveBtn.innerHTML = `<i class="fas fa-save"></i> Save`;
      deleteBtn.style.display = 'none';
      if (previewPanel.style.display !== 'none') {
        previewPanel.innerHTML = '';
      }
      renderList();
    }

    // select section from list (exposed globally)
    window.selectSection = function(id) {
      const sec = sections.find(s => s.id === id);
      if (sec) {
        loadSectionToForm(sec);
      }
    };

    // move section up/down
    window.moveSection = function(id, dir) {
      const idx = sections.findIndex(s => s.id === id);
      if (idx === -1) return;
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= sections.length) return;
      const [item] = sections.splice(idx, 1);
      sections.splice(newIdx, 0, item);
      renderAll();
      // keep selection
      if (selectedId) {
        // re-select
        const sec = sections.find(s => s.id === selectedId);
        if (sec) loadSectionToForm(sec);
      }
    };

    // delete section
    window.deleteSection = function(id) {
      if (!confirm(`Delete section "${sections.find(s => s.id === id)?.title}"?`)) return;
      sections = sections.filter(s => s.id !== id);
      if (selectedId === id) {
        clearEditor();
      }
      renderAll();
    };

    // toggle preview item (for demo)
    window.togglePreviewItem = function(header) {
      const item = header.closest('.accordion-item-preview');
      if (!item) return;
      // close siblings
      const parent = item.parentElement;
      if (parent) {
        parent.querySelectorAll('.accordion-item-preview').forEach(el => el.classList.remove('active'));
      }
      item.classList.toggle('active');
    };

    // ----- form submit (add / update) -----
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const title = titleInput.value.trim();
      const icon = iconInput.value.trim() || 'fa-cube';
      const content = contentTextarea.value.trim();
      const open = statusSelect.value === 'open';

      if (!title) { alert('Title is required'); return; }
      if (!content) { alert('Content is required'); return; }

      const editId = editIdHidden.value;
      if (editId) {
        // update
        const idx = sections.findIndex(s => s.id === editId);
        if (idx !== -1) {
          sections[idx] = { ...sections[idx], title, icon, content, open };
          renderAll();
          // keep editing
          loadSectionToForm(sections[idx]);
        }
      } else {
        // add
        const newSec = {
          id: generateId(),
          title,
          icon,
          content,
          open
        };
        sections.push(newSec);
        renderAll();
        // select new
        loadSectionToForm(newSec);
      }
    });

    // cancel button
    cancelBtn.addEventListener('click', function() {
      clearEditor();
      // deselect in list
      renderList();
    });

    // delete button (for current selected)
    deleteBtn.addEventListener('click', function() {
      const id = editIdHidden.value;
      if (id) {
        window.deleteSection(id);
      }
    });

    // add button (from sidebar)
    addBtn.addEventListener('click', function() {
      // create a new empty section and select it
      const newSec = {
        id: generateId(),
        title: 'New Section',
        icon: 'fa-cube',
        content: 'Write your content here...',
        open: false
      };
      sections.push(newSec);
      renderAll();
      loadSectionToForm(newSec);
    });

    // ----- init -----
    function init() {
      sections = DEFAULT_SECTIONS.map(s => ({ ...s, id: generateId() }));
      if (sections.length) sections[0].open = true;
      renderAll();
      // select first
      if (sections.length) {
        loadSectionToForm(sections[0]);
      } else {
        clearEditor();
      }
    }

    init();

    // also when content changes, if preview active update
    contentTextarea.addEventListener('input', function() {
      if (previewPanel.style.display !== 'none') {
        updatePreviewContent();
      }
    });

    // Emoji shortcut: we can also add a simple emoji picker, but we keep it minimal
  })();
</script>
</body>
</html>
